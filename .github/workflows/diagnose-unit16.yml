name: Prepare unit 16 integration

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: prepare-unit16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'agent/einheit-16-angststoerungen-adhs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Install pinned project dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check

      - name: Integrate, generate, and validate core outputs
        env:
          RUNTIME_STATUS_MANAGED: '0'
        run: |
          set -Eeuo pipefail
          python .automation-repair/integrate_unit16.py
          python scripts/build_literature.py
          git diff --check
          python scripts/validate_prompt_baselines.py
          python scripts/build_graph.py
          python scripts/validate_graph.py
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py
          python scripts/build_anki.py

      - name: Collect exact commit payload
        shell: bash
        run: |
          set -Eeuo pipefail
          root=build/unit16-integration
          mkdir -p "$root"
          while IFS= read -r path; do
            mkdir -p "$root/$(dirname "$path")"
            cp "$path" "$root/$path"
          done <<'EOF'
          02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md
          02-Vertiefung/04-Angststoerungen-und-ADHS.md
          CHANGELOG.md
          Glossar.md
          Literatur.md
          README.md
          ROADMAP.md
          cards/cards.yaml
          index.json
          knowledge-graph/planned-nodes.yaml
          mkdocs.yml
          references.bib
          references.json
          references/Hoskins2026.md
          references/Njardvik2025.md
          EOF
          git diff --stat > "$root/validation-diff-stat.txt"
          git diff --check

      - name: Upload validated integration payload
        uses: actions/upload-artifact@v7
        with:
          name: unit16-integration-${{ github.event.pull_request.head.sha }}
          path: build/unit16-integration/
          if-no-files-found: error
          retention-days: 7
