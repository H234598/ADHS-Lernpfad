name: Diagnose unit 16 payload

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: diagnose-unit16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/einheit-16-angststoerungen-adhs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reconstruct and inspect payload
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/unit16
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path, PurePosixPath
          import tarfile

          output = Path('build/unit16')
          expected_payload_sha256 = '05f2646418b408b93cc85b0c9184c0fb358d565263e197cd1ac8eadcabc17fd5'
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          fragments = sorted(Path('.automation-repair').glob('unit16.payload.*'))
          expected_fragments = [f'unit16.payload.{index:02d}' for index in range(6)]
          if [path.name for path in fragments] != expected_fragments:
              raise SystemExit('Unerwartete Payload-Fragmente')

          def overlap(left: str, right: str) -> int:
              candidate = right + '\0' + left[-len(right):]
              prefix = [0] * len(candidate)
              for index in range(1, len(candidate)):
                  match = prefix[index - 1]
                  while match and candidate[index] != candidate[match]:
                      match = prefix[match - 1]
                  if candidate[index] == candidate[match]:
                      match += 1
                  prefix[index] = match
              return prefix[-1]

          normalized_parts: list[str] = []
          payload = ''
          repairs: list[tuple[str, int]] = []
          boundaries: list[int] = []
          fragment_lengths: dict[str, int] = {}
          for fragment_path in fragments:
              fragment = fragment_path.read_text(encoding='ascii').strip()
              fragment_lengths[fragment_path.name] = len(fragment)
              if payload:
                  shared = overlap(payload, fragment)
                  if shared >= 256:
                      repairs.append((fragment_path.name, shared))
                      fragment = fragment[shared:]
              normalized_parts.append(fragment)
              payload += fragment
              boundaries.append(len(payload))

          diagnosis = [
              *(f'{name}_chars={length}' for name, length in fragment_lengths.items()),
              f'repairs={repairs}',
              f'normalized_boundaries={boundaries}',
              f'payload_chars={len(payload)}',
              f'payload_mod4={len(payload) % 4}',
          ]
          if len(repairs) != 1 or repairs[0][0] != 'unit16.payload.01':
              output.joinpath('diagnosis.txt').write_text('\n'.join(diagnosis) + '\n', encoding='utf-8')
              raise SystemExit(f'Unerwartetes Überlappungsmuster: {repairs}')

          candidate_positions = sorted({0, *boundaries[:-1], len(payload)})
          recovered_payload = None
          recovery = None
          for position in candidate_positions:
              prefix = payload[:position]
              suffix = payload[position:]
              for character in alphabet:
                  candidate = prefix + character + suffix
                  if hashlib.sha256(candidate.encode('ascii')).hexdigest() == expected_payload_sha256:
                      recovered_payload = candidate
                      recovery = (position, character)
                      break
              if recovered_payload is not None:
                  break

          diagnosis.append(f'candidate_positions={candidate_positions}')
          diagnosis.append(f'recovery={recovery}')
          if recovered_payload is None:
              output.joinpath('diagnosis.txt').write_text('\n'.join(diagnosis) + '\n', encoding='utf-8')
              raise SystemExit('Keine einzelne fehlende Base64-Stelle an einer Fragmentgrenze passt zur Soll-Prüfsumme')

          archive = base64.b64decode(recovered_payload, validate=True)
          archive_path = output / 'unit16.tar.gz'
          archive_path.write_bytes(archive)
          output.joinpath('unit16.payload.b64').write_text(recovered_payload, encoding='ascii')
          diagnosis.extend(
              [
                  f'recovered_payload_chars={len(recovered_payload)}',
                  f'payload_sha256={hashlib.sha256(recovered_payload.encode("ascii")).hexdigest()}',
                  f'archive_bytes={len(archive)}',
                  f'archive_sha256={hashlib.sha256(archive).hexdigest()}',
              ]
          )
          output.joinpath('diagnosis.txt').write_text('\n'.join(diagnosis) + '\n', encoding='utf-8')

          expected = {
              '02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md',
              '02-Vertiefung/04-Angststoerungen-und-ADHS.md',
              'README.md', 'ROADMAP.md', 'Glossar.md', 'cards/cards.yaml',
              'index.json', 'knowledge-graph/planned-nodes.yaml', 'mkdocs.yml',
              'references/Hoskins2026.md', 'references/Njardvik2025.md',
          }
          with tarfile.open(archive_path, 'r:gz') as tar:
              members = tar.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f'Unerwartete Archivmitglieder: {sorted(names ^ expected)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'Unsicherer Archiveintrag: {member.name}')
              tar.extractall(output / 'extracted', filter='data')
          PY

      - name: Upload reconstructed source payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit16-reconstructed-${{ github.event.pull_request.head.sha }}
          path: build/unit16/
          if-no-files-found: error
          retention-days: 7
