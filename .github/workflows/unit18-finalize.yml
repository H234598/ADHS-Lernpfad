name: Finalize unit 18 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/einheit-18-trauma-ptbs-komplexe-traumafolgen'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out unit branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-18-trauma-ptbs-komplexe-traumafolgen
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install literature dependency
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m pip check

      - name: Patch project indexes and regenerate literature
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          unit17 = Path('02-Vertiefung/05-Zwangssymptome-und-Zwangsstoerung.md')
          text = unit17.read_text(encoding='utf-8')
          old = '- Weiter: [[ROADMAP#A2 · Angst, Zwang, Trauma und episodische Störungen — P0|Trauma, PTBS und komplexe Traumafolgen]]'
          new = '- Weiter: [[02-Vertiefung/06-Trauma-PTBS-und-komplexe-Traumafolgen|Trauma, PTBS und komplexe Traumafolgen]]'
          if old not in text:
              raise SystemExit('Erwarteter Navigationslink in Einheit 17 fehlt')
          unit17.write_text(text.replace(old, new, 1), encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace('last_reviewed: 2026-07-31', 'last_reviewed: 2026-08-02', 1)
          text = text.replace('Der Lernpfad umfasst derzeit 17 fortlaufende Einheiten:', 'Der Lernpfad umfasst derzeit 18 fortlaufende Einheiten:', 1)
          marker = '17. Zwangssymptome, Zwangsstörung und ADHS: Funktion, Abgrenzung und Koexistenz\n'
          addition = marker + '18. Trauma, PTBS und komplexe Traumafolgen: Zeitachsen, Abgrenzung und Koexistenz mit ADHS\n'
          if marker not in text:
              raise SystemExit('Einheit-17-Marker in ROADMAP fehlt')
          text = text.replace(marker, addition, 1)
          old_heading = '- [ ] **Trauma, PTBS und komplexe Traumafolgen**'
          new_heading = '- [x] **Trauma, PTBS und komplexe Traumafolgen** — umgesetzt als Einheit 18'
          if old_heading not in text:
              raise SystemExit('Offener Trauma-Roadmap-Punkt fehlt')
          text = text.replace(old_heading, new_heading, 1)
          roadmap.write_text(text, encoding='utf-8')

          glossary = Path('Glossar.md')
          text = glossary.read_text(encoding='utf-8')
          text = text.replace('last_reviewed: 2026-07-31', 'last_reviewed: 2026-08-02', 1)
          insertions = [
              ('## Dosisfindung\n', '## Dissoziation\nVeränderung der Integration von Bewusstsein, Erinnerung, Wahrnehmung, Identität oder Körpererleben; einzelne Momente von Abschweifen oder Vergessen sind nicht automatisch dissoziativ.\n\n## Dosisfindung\n'),
              ('## Komorbidität\n', '## Intrusion\nUnwillkürlich auftauchende Erinnerung, Vorstellung, Körperempfindung oder ein Traum mit Bezug zu einem belastenden Ereignis; bei PTBS kann sie sich wie ein Wiedererleben in der Gegenwart anfühlen.\n\n## Komorbidität\n'),
              ('## Koexistenz\n', '## Komplexe posttraumatische Belastungsstörung\nICD-11-Diagnose mit den Kernmerkmalen einer PTBS und zusätzlichen anhaltenden Störungen der Emotionsregulation, des Selbstkonzepts und der Beziehungsgestaltung; nicht gleichbedeutend mit jeder schweren oder lang andauernden Belastungsreaktion.\n\n## Koexistenz\n'),
              ('## Psychoedukation\n', '## Posttraumatische Belastungsstörung\nStörung nach einem oder mehreren traumatischen Ereignissen mit trauma-bezogenem Wiedererleben, Vermeidung und anhaltendem Bedrohungsgefühl sowie klinisch relevanter Beeinträchtigung; Traumaexposition allein ist keine PTBS.\n\n## Psychoedukation\n'),
              ('## Titration\n', '## Traumaexposition\nKonfrontation mit außergewöhnlicher Bedrohung, schwerer Gewalt, Verletzung oder Tod; sie kann starke Reaktionen auslösen, führt aber nicht zwangsläufig zu einer posttraumatischen Belastungsstörung.\n\n## Titration\n'),
          ]
          for marker, replacement in insertions:
              if marker not in text:
                  raise SystemExit(f'Glossarmarker fehlt: {marker.strip()}')
              text = text.replace(marker, replacement, 1)
          glossary.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''\n## 2026-08-02 – Einheit 18: Trauma, PTBS und komplexe Traumafolgen\n\n- neue Vertiefungseinheit zur Abgrenzung und Koexistenz von ADHS, PTBS und komplexer PTBS;\n- aktuelle deutsche S3-Leitlinie von 2026 und ICD-11-CDDR als diagnostische Grundlage ergänzt;\n- systematische Evidenz zur ADHS/PTBS-Koexistenz und zu geschlechtsbezogenen Gruppenunterschieden eingeordnet;\n- README, Roadmap, Index, MkDocs-Navigation, Glossar, Lernkarten und Wissensgraph aktualisiert;\n- Literatur.md, references.bib und references.json reproduzierbar aus den Studienkarten regeneriert.\n'''
          heading = '# Changelog\n'
          if heading not in text:
              raise SystemExit('Changelog-Hauptüberschrift fehlt')
          if '## 2026-08-02 – Einheit 18:' not in text:
              text = text.replace(heading, heading + entry, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          python scripts/build_literature.py
          rm .github/workflows/unit18-finalize.yml

      - name: Commit generated and linked outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            02-Vertiefung/05-Zwangssymptome-und-Zwangsstoerung.md \
            ROADMAP.md Glossar.md CHANGELOG.md \
            Literatur.md references.bib references.json \
            .github/workflows/unit18-finalize.yml
          git diff --cached --check
          git commit -m 'docs: finalisiere Einheit 18 und Literaturausgaben'
          git push origin HEAD:agent/einheit-18-trauma-ptbs-komplexe-traumafolgen
