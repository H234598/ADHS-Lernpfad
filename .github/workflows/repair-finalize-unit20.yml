name: Repair unit 20 finalizer

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-finalize-unit20
  cancel-in-progress: false

jobs:
  repair:
    name: Repair finalizer trigger and runtime status workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout fixed unit branch without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-20-substanzgebrauch-abhaengigkeit
          fetch-depth: 0
          persist-credentials: false

      - name: Patch finalizer, remove repair workflow and push
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-unit20.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'types: [opened]': 'types: [opened, synchronize]',
              '--workflow finalize-unit20': '--workflow manual',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'erwartete genau eine Fundstelle für {old!r}, gefunden {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/repair-finalize-unit20.yml
          git add .github/workflows/finalize-unit20.yml .github/workflows/repair-finalize-unit20.yml
          git diff --cached --check
          git config user.name "H234598"
          git config user.email "54270221+H234598@users.noreply.github.com"
          git commit -m "fix: verwende gültigen Runtime-Workflow für Einheit 20"

          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/einheit-20-substanzgebrauch-abhaengigkeit
