# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  codacy-analysis:
    permissions:
      contents: read
      security-events: write
    name: Codacy analyzer (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - tool: bandit
            tool_timeout: 10minutes
          - tool: prospector
            tool_timeout: 10minutes
          - tool: pylintpython3
            tool_timeout: 10minutes
          - tool: ruff
            tool_timeout: 10minutes
          - tool: shellcheck
            tool_timeout: 10minutes
          - tool: psscriptanalyzer
            tool_timeout: 10minutes
          - tool: eslint-9
            tool_timeout: 10minutes
          - tool: biome
            tool_timeout: 10minutes
          - tool: stylelint
            tool_timeout: 10minutes
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Run each repository-relevant analyzer in isolation. This preserves the
      # stable Codacy coverage while preventing one incompatible legacy analyzer
      # from corrupting another tool's SARIF output or blocking the whole job.
      - name: Run Codacy ${{ matrix.tool }}
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          tool: ${{ matrix.tool }}
          gh-code-scanning-compat: true
          # Findings are uploaded to GitHub code scanning; execution failures
          # and timeouts still fail this gate via fail-if-incomplete.
          max-allowed-issues: 2147483647
          tool-timeout: ${{ matrix.tool_timeout }}
          fail-if-incomplete: true

      - name: Upload SARIF results file
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: codacy-${{ matrix.tool }}

  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    needs: codacy-analysis
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Enforce complete analyzer matrix
        env:
          ANALYZER_RESULT: ${{ needs.codacy-analysis.result }}
        run: |
          if [[ "$ANALYZER_RESULT" != "success" ]]; then
            echo "Codacy analyzer matrix did not complete successfully: $ANALYZER_RESULT" >&2
            exit 1
          fi
