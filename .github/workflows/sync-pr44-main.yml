name: Sync PR 44 with main

on:
  push:
    branches:
      - feat/hard-review-repair-policy
    paths:
      - .github/workflows/sync-pr44-main.yml

permissions:
  contents: write

concurrency:
  group: sync-pr44-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v7
        with:
          ref: feat/hard-review-repair-policy
          fetch-depth: 0

      - name: Merge current main and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-pr44-main.yml
          git commit -m "chore: remove one-shot main sync workflow"
          git push origin HEAD:feat/hard-review-repair-policy
