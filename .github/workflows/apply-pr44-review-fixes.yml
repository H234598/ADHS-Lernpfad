name: Apply PR 44 review fixes

on:
  push:
    branches:
      - feat/hard-review-repair-policy
    paths:
      - .pr44-review-fix/**
      - .github/workflows/apply-pr44-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-pr44-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v7
        with:
          ref: feat/hard-review-repair-policy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply, validate and push fixes
        run: python .pr44-review-fix/apply.py
