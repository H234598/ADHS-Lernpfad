name: CodeRabbit trusted publisher

on:
  workflow_run:
    workflows: ["CodeRabbit hard gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull-Request-Nummer
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: coderabbit-trusted-publisher-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted CodeRabbit head check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted implementation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Determine pull request
        id: pr
        shell: bash
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${INPUT_PR:-${WORKFLOW_PR:-}}"
          if [[ -z "$PR_NUMBER" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Kein Pull Request im Ereignis; Trusted Publisher wird übersprungen.'
          else
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate current-head CodeRabbit gate
        id: semantic
        if: steps.pr.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.number }}
        run: |
          python scripts/review_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR"

      - name: Enforce current CodeRabbit review state
        id: formal
        if: steps.pr.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.number }}
        run: |
          python scripts/coderabbit_review_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR" \
            --block-dismissed

      - name: Publish final current-head CodeRabbit gate
        if: always() && steps.pr.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.number }}
          FORMAL_OUTCOME: ${{ steps.formal.outcome }}
        run: |
          python scripts/publish_review_gate_check.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR" \
            --enforcement-outcome "$FORMAL_OUTCOME"
