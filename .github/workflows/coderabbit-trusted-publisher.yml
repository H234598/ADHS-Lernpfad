name: CodeRabbit trusted publisher

on:
  workflow_run:
    workflows: ["CodeRabbit hard gate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: coderabbit-trusted-publisher-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted CodeRabbit head check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted implementation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Determine pull request
        id: pr
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER="${WORKFLOW_PR:-}"
          VERIFY_PATH="/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          SEARCH_PREFIX="/pulls?state=open&head="
          export PR_NUMBER VERIFY_PATH SEARCH_PREFIX

          python - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          api = "https://api.github.com"
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          direct_number = os.environ.get("PR_NUMBER", "").strip()
          head_repository = os.environ.get("HEAD_REPOSITORY", "").strip()
          head_branch = os.environ.get("HEAD_BRANCH", "").strip()
          head_sha = os.environ.get("HEAD_SHA", "").strip()
          output = os.environ["GITHUB_OUTPUT"]

          def request_json(path):
              request = Request(
                  api + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "ADHS-Lernpfad-trusted-coderabbit-publisher",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          def matches(pr):
              head = pr.get("head") or {}
              head_repo = head.get("repo") or {}
              base = pr.get("base") or {}
              base_repo = base.get("repo") or {}
              return (
                  pr.get("state") == "open"
                  and head_repo.get("full_name") == head_repository
                  and head.get("ref") == head_branch
                  and head.get("sha") == head_sha
                  and base_repo.get("full_name") == repository
              )

          matched = []
          if direct_number:
              pull = request_json(os.environ["VERIFY_PATH"])
              if matches(pull):
                  matched = [pull]
          elif head_repository and head_branch and head_sha:
              owner = head_repository.split("/", 1)[0]
              query = urlencode(
                  {
                      "state": "open",
                      "head": f"{owner}:{head_branch}",
                      "per_page": 100,
                  }
              )
              search_path = (
                  f"/repos/{repository}"
                  f"{os.environ['SEARCH_PREFIX']}"
                  f"{query.split('head=', 1)[1]}"
              )
              pulls = request_json(search_path)
              matched = [
                  pull
                  for pull in pulls
                  if isinstance(pull, dict) and matches(pull)
              ]

          if len(matched) != 1:
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write("skip=true\n")
              print(
                  "Kein eindeutig passender offener Pull Request für "
                  f"{head_repository}:{head_branch}@{head_sha}; "
                  "Trusted Publisher wird übersprungen."
              )
          else:
              number = int(matched[0]["number"])
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write(f"number={number}\n")
                  stream.write("skip=false\n")
              print(f"Verifizierter Pull Request: #{number}")
          PY

      - name: Evaluate current-head CodeRabbit gate
        id: semantic
        if: steps.pr.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.number }}
        run: |
          python scripts/review_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR"

      - name: Enforce current CodeRabbit review state
        id: formal
        if: steps.pr.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.number }}
        run: |
          python scripts/coderabbit_review_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR" \
            --block-dismissed

      - name: Publish final current-head CodeRabbit gate
        if: always() && steps.pr.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.number }}
          FORMAL_OUTCOME: ${{ steps.formal.outcome }}
        run: |
          python scripts/publish_review_gate_check.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR" \
            --enforcement-outcome "$FORMAL_OUTCOME"
