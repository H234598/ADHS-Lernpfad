name: Repair unit 20 literature sync

on:
  push:
    branches:
      - agent/einheit-20-substanzgebrauch-abhaengigkeit
    paths:
      - .github/workflows/repair-unit20-literature-sync.yml

permissions:
  contents: write

concurrency:
  group: repair-unit20-literature-sync
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout fixed unit branch without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-20-substanzgebrauch-abhaengigkeit
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repair ancestry and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "c57f5bdf315b587cd9dbf253ffa4c35624e17bae"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-unit20-literature-sync.yml"
          git fetch origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies and browser
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies
          npx playwright install --with-deps chromium

      - name: Regenerate literature and run complete repair validation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "H234598"
          git config user.email "54270221+H234598@users.noreply.github.com"

          python scripts/build_literature.py
          test "$(git diff --name-only)" = "Literatur.md"
          git diff --exit-code -- references.bib references.json
          grep -Fx 'last_reviewed: 2026-08-08' Literatur.md
          git diff --check

          git add Literatur.md references.bib references.json
          python scripts/build_literature.py
          git diff --exit-code -- Literatur.md references.bib references.json

          REMARK_BASE_SHA="origin/main" REMARK_HEAD_SHA="HEAD" \
            npm run lint:markdown:changed

          python -m compileall -q scripts tests
          python scripts/validate_prompt_baselines.py
          find Sync -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          pwsh -NoProfile -Command '
            $failed = $false
            Get-ChildItem Sync -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $failed = $true
                Write-Host "PowerShell-Parserfehler in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              }
            }
            if ($failed) { exit 1 }
          '
          bash Sync/tests/test-posix-sync.sh
          RUNTIME_STATUS_MANAGED=0 python -m pytest -q
          npm test
          python scripts/validate_links.py
          python scripts/build_graph.py
          python scripts/validate_graph.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py
          python scripts/build_anki.py
          python scripts/build_docs.py
          mkdocs build --strict
          npm run test:web

          python scripts/build_literature.py
          git diff --exit-code -- Literatur.md references.bib references.json

          rm .github/workflows/repair-unit20-literature-sync.yml
          git add .github/workflows/repair-unit20-literature-sync.yml

          test "$(git diff --cached --name-only | tr '\n' ' ')" = ".github/workflows/repair-unit20-literature-sync.yml Literatur.md "
          git diff --cached --check
          git diff --cached -- Literatur.md
          git commit -m "fix: synchronisiere Literaturmetadaten für Einheit 20"

      - name: Push validated repair
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_AUTH_HEADER="AUTHORIZATION: basic $auth" \
            git --config-env=http.https://github.com/.extraheader=GIT_AUTH_HEADER \
            push origin HEAD:agent/einheit-20-substanzgebrauch-abhaengigkeit
