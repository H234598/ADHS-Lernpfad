name: Integrate unit 16

on:
  push:
    branches: [agent/einheit-16-angststoerungen-adhs]
    paths:
      - .github/workflows/apply-unit16.yml
      - 02-Vertiefung/04-Angststoerungen-und-ADHS.md
      - references/Hoskins2026.md
      - references/Njardvik2025.md

permissions:
  contents: write

concurrency:
  group: integrate-unit16
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-16-angststoerungen-adhs
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Integrate unit into project files
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Integrationsanker fehlt in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              '02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md',
              '- Weiter: [[ROADMAP#Milestone A – Klinische Heterogenität und Lebensspanne|Nächste Themen laut Roadmap]]',
              '- Weiter: [[02-Vertiefung/04-Angststoerungen-und-ADHS|Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen]]',
          )

          replace_once('README.md', 'version: 0.17.0', 'version: 0.18.0')
          replace_once('README.md', 'last_reviewed: 2026-07-25', 'last_reviewed: 2026-07-30')
          replace_once(
              'README.md',
              'tags: [ADHS, Neurobiologie, Autismus, Parkinson, Lernpfad]',
              'tags: [ADHS, Neurobiologie, Autismus, Parkinson, Angststörungen, Lernpfad]',
          )
          replace_once(
              'README.md',
              '15. [[02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen|Parkinson, ADHS und mechanistische Vergleiche]]',
              '15. [[02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen|Parkinson, ADHS und mechanistische Vergleiche]]\n16. [[02-Vertiefung/04-Angststoerungen-und-ADHS|Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen]]',
          )

          replace_once('ROADMAP.md', 'last_reviewed: 2026-07-25', 'last_reviewed: 2026-07-30')
          replace_once(
              'ROADMAP.md',
              'Der Lernpfad umfasst derzeit 15 fortlaufende Einheiten:',
              'Der Lernpfad umfasst derzeit 16 fortlaufende Einheiten:',
          )
          replace_once(
              'ROADMAP.md',
              '15. Parkinson, ADHS und mechanistische Vergleiche',
              '15. Parkinson, ADHS und mechanistische Vergleiche\n16. Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen',
          )
          replace_once(
              'ROADMAP.md',
              '- [ ] **Angststörungen und ADHS**',
              '- [x] **Angststörungen und ADHS** — umgesetzt als Einheit 16',
          )

          replace_once('Glossar.md', 'last_reviewed: 2026-07-25', 'last_reviewed: 2026-07-30')
          replace_once(
              'Glossar.md',
              '## Arbeitsgedächtnis\nSystem zur kurzfristigen aktiven Speicherung und Bearbeitung von Information.',
              '## Angststörung\nPsychische Störung mit anhaltender oder wiederkehrender Furcht, Sorge, körperlicher Aktivierung oder Vermeidung, die über eine vorübergehende angemessene Angstreaktion hinausgeht und relevante Beeinträchtigung verursacht.\n\n## Arbeitsgedächtnis\nSystem zur kurzfristigen aktiven Speicherung und Bearbeitung von Information.',
          )
          replace_once(
              'Glossar.md',
              '## Screening\nKurze systematische Prüfung, die eine Wahrscheinlichkeit abschätzt, aber keine vollständige Diagnose ersetzt.',
              '## Sicherheitsverhalten\nHandlung zur kurzfristigen Verringerung einer befürchteten Gefahr oder Unsicherheit, etwa Rückversicherung oder wiederholte Kontrolle; kann eine realistische Kompensation sein, bei Angst aber auch korrigierende Erfahrungen verhindern.\n\n## Screening\nKurze systematische Prüfung, die eine Wahrscheinlichkeit abschätzt, aber keine vollständige Diagnose ersetzt.',
          )
          replace_once(
              'Glossar.md',
              '## Zirkadianer Rhythmus',
              '## Vermeidung\nNichtausführen oder Verlassen einer gefürchteten Situation, Aufgabe oder inneren Erfahrung; vermindert Belastung oft kurzfristig, kann Angst und Funktionsbeeinträchtigung langfristig jedoch aufrechterhalten.\n\n## Zirkadianer Rhythmus',
          )

          cards = Path('cards/cards.yaml')
          cards_text = cards.read_text(encoding='utf-8')
          if '  unit: 16\n' not in cards_text:
              cards_text += '''\n- id: 1016
  unit: 16
  front: Warum kann Aufschieben bei ADHS und einer Angststörung ähnlich aussehen, obwohl unterschiedliche Mechanismen beteiligt sein können?
  back: Bei ADHS können unklare Schritte, geringe unmittelbare Rückmeldung oder instabile Zielaktivierung den Start erschweren; bei Angst kann Aufschub erwartete Fehler, Bewertung oder körperliche Aktivierung vermeiden. Beide Mechanismen können gleichzeitig vorkommen.
  tags:
  - ADHS
  - Angststörungen
  - Vertiefung
  - Differentialdiagnostik
  - Einheit_16
'''
              cards.write_text(cards_text, encoding='utf-8')

          index_path = Path('index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['version'] = '0.18.0'
          index['last_reviewed'] = '2026-07-30'
          if not any(chapter.get('number') == 16 for chapter in index['chapters']):
              index['chapters'].append(
                  {
                      'number': 16,
                      'path': '02-Vertiefung/04-Angststoerungen-und-ADHS.md',
                      'title': 'Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen',
                  }
              )
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'knowledge-graph/planned-nodes.yaml',
              '02-Vertiefung/04-Studienmethodik-Effektgroessen-Bias-und-Kausalitaet',
              '02-Vertiefung/05-Studienmethodik-Effektgroessen-Bias-und-Kausalitaet',
          )
          replace_once(
              'mkdocs.yml',
              '      - Parkinson, ADHS und mechanistische Vergleiche: 02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md',
              '      - Parkinson, ADHS und mechanistische Vergleiche: 02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md\n      - Angststörungen und ADHS: 02-Vertiefung/04-Angststoerungen-und-ADHS.md',
          )

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          heading = '## 0.18.0 – 2026-07-30'
          if heading not in changelog_text:
              entry = '''## 0.18.0 – 2026-07-30

- Einheit 16 „Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen“ ergänzt
- Angstsymptome, diagnostizierte Angststörungen und ADHS-bezogene Regulationsprobleme methodisch getrennt
- wechselseitige Verstärkung, Differentialdiagnostik, Sicherheitsverhalten und Vermeidung ohne pauschale Kausalbehauptung eingeordnet
- zwei aktuelle Meta-Analysen, Glossarbegriffe, Anki-Karte, Navigation, Roadmap und Wissensgraph-Planung ergänzt

'''
              changelog_text = changelog_text.replace('# Änderungsverlauf\n\n', '# Änderungsverlauf\n\n' + entry, 1)
              changelog.write_text(changelog_text, encoding='utf-8')
          PY

      - name: Install pinned dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies
          npx playwright install --with-deps chromium

      - name: Generate and validate
        env:
          RUNTIME_STATUS_MANAGED: '0'
        run: |
          set -Eeuo pipefail
          python scripts/build_literature.py
          git diff --check
          python -m compileall -q scripts tests
          python scripts/validate_prompt_baselines.py
          find Sync -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash Sync/tests/test-posix-sync.sh
          python -m pytest -q
          npm test
          python scripts/build_graph.py
          python scripts/validate_graph.py
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py
          python scripts/build_anki.py
          python scripts/build_docs.py
          mkdocs build --strict
          node scripts/remark_lint.mjs --files \
            02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md \
            02-Vertiefung/04-Angststoerungen-und-ADHS.md \
            README.md ROADMAP.md Glossar.md CHANGELOG.md \
            references/Hoskins2026.md references/Njardvik2025.md
          npm run test:web

      - name: Commit validated content and remove transient files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/apply-unit16.yml \
            .github/workflows/diagnose-unit16.yml \
            .automation-repair/unit16.payload.*
          git add \
            02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md \
            02-Vertiefung/04-Angststoerungen-und-ADHS.md \
            README.md ROADMAP.md Glossar.md CHANGELOG.md cards/cards.yaml index.json \
            knowledge-graph/planned-nodes.yaml mkdocs.yml \
            references/Hoskins2026.md references/Njardvik2025.md \
            Literatur.md references.bib references.json
          git diff --cached --check
          git status --short
          git diff --cached --name-status
          git commit -m 'feat: ergänze Einheit 16 zu Angststörungen und ADHS'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/einheit-16-angststoerungen-adhs
