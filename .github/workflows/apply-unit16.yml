name: Finalize unit 16 integration

on:
  push:
    branches: [agent/einheit-16-angststoerungen-adhs]
    paths:
      - .github/workflows/apply-unit16.yml
      - .automation-repair/integrate_unit16.py

permissions:
  contents: write

concurrency:
  group: finalize-unit16-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-16-angststoerungen-adhs
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Install pinned project dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check

      - name: Integrate, generate, and validate core outputs
        env:
          RUNTIME_STATUS_MANAGED: '0'
        run: |
          set -Eeuo pipefail
          python .automation-repair/integrate_unit16.py
          python scripts/build_literature.py
          git diff --check
          python scripts/validate_prompt_baselines.py
          python scripts/build_graph.py
          python scripts/validate_graph.py
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py
          python scripts/build_anki.py

      - name: Commit validated integration and remove transient files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/apply-unit16.yml \
            .github/workflows/diagnose-unit16.yml \
            .automation-repair/integrate_unit16.py \
            .automation-repair/unit16.payload.*
          git add \
            02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md \
            02-Vertiefung/04-Angststoerungen-und-ADHS.md \
            CHANGELOG.md Glossar.md Literatur.md README.md ROADMAP.md \
            cards/cards.yaml index.json knowledge-graph/planned-nodes.yaml mkdocs.yml \
            references.bib references.json references/Hoskins2026.md references/Njardvik2025.md
          git diff --cached --check
          git commit -m 'feat: ergänze Einheit 16 zu Angststörungen und ADHS'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/einheit-16-angststoerungen-adhs
