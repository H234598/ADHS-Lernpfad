name: Apply unit 16 payload

on:
  push:
    branches: [agent/einheit-16-angststoerungen-adhs]
    paths:
      - .automation-repair/unit16.payload.*
      - .github/workflows/apply-unit16.yml

permissions:
  contents: write

concurrency:
  group: apply-unit16-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-16-angststoerungen-adhs
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Reconstruct and safely extract payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python - "$RUNNER_TEMP/unit16.tar.gz" <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          fragment_root = Path('.automation-repair')
          expected_names = [f'unit16.payload.{index:02d}' for index in range(6)]
          fragments = sorted(fragment_root.glob('unit16.payload.*'))
          if [path.name for path in fragments] != expected_names:
              raise SystemExit('Unerwartete Payload-Fragmente')

          def overlap(left: str, right: str) -> int:
              candidate = right + '\0' + left[-len(right):]
              prefix = [0] * len(candidate)
              for index in range(1, len(candidate)):
                  match = prefix[index - 1]
                  while match and candidate[index] != candidate[match]:
                      match = prefix[match - 1]
                  if candidate[index] == candidate[match]:
                      match += 1
                  prefix[index] = match
              return prefix[-1]

          payload = ''
          repairs: list[tuple[str, int]] = []
          boundaries: list[int] = []
          for path in fragments:
              fragment = path.read_text(encoding='ascii').strip()
              if payload:
                  shared = overlap(payload, fragment)
                  if shared >= 256:
                      repairs.append((path.name, shared))
                      fragment = fragment[shared:]
              payload += fragment
              boundaries.append(len(payload))

          if len(repairs) != 1 or repairs[0][0] != 'unit16.payload.01':
              raise SystemExit(f'Unerwartetes Fragment-Überlappungsmuster: {repairs}')

          expected_sha = '05f2646418b408b93cc85b0c9184c0fb358d565263e197cd1ac8eadcabc17fd5'
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          recovery: tuple[int, str] | None = None
          if hashlib.sha256(payload.encode('ascii')).hexdigest() != expected_sha:
              if len(payload) % 4 != 3:
                  raise SystemExit(
                      f'Payload beschädigt, aber nicht durch genau ein fehlendes Base64-Zeichen: '
                      f'len={len(payload)} mod4={len(payload) % 4}'
                  )

              # Fragment 02 besitzt als einziges reguläres Fragment 6999 statt
              # 7000 Zeichen. Durchsuche deshalb zuerst exakt seinen normierten
              # Bereich; nur falls diese strukturelle Diagnose nicht trägt,
              # folgt ein vollständiger deterministischer Fallback.
              primary = range(boundaries[1], boundaries[2] + 1)
              fallback = range(0, len(payload) + 1)
              tested: set[int] = set()
              for positions in (primary, fallback):
                  for position in positions:
                      if position in tested:
                          continue
                      tested.add(position)
                      prefix = payload[:position]
                      suffix = payload[position:]
                      for character in alphabet:
                          candidate = prefix + character + suffix
                          if hashlib.sha256(candidate.encode('ascii')).hexdigest() == expected_sha:
                              payload = candidate
                              recovery = (position, character)
                              break
                      if recovery is not None:
                          break
                  if recovery is not None:
                      break
              if recovery is None:
                  raise SystemExit('Fehlendes Base64-Zeichen konnte nicht rekonstruiert werden')

          if len(payload) % 4:
              raise SystemExit('Rekonstruierte Base64-Payload ist nicht 4-Byte-ausgerichtet')
          archive_bytes = base64.b64decode(payload, validate=True)
          archive_path = Path(sys.argv[1])
          archive_path.write_bytes(archive_bytes)
          print(f'Entfernter Überlapp: {repairs[0][1]} Zeichen aus unit16.payload.01')
          print(f'Rekonstruiertes fehlendes Zeichen: {recovery}')
          print(f'Payload-SHA-256: {hashlib.sha256(payload.encode("ascii")).hexdigest()}')
          print(f'Archiv-SHA-256: {hashlib.sha256(archive_bytes).hexdigest()}')

          expected = {
              '02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md',
              '02-Vertiefung/04-Angststoerungen-und-ADHS.md',
              'README.md', 'ROADMAP.md', 'Glossar.md', 'cards/cards.yaml',
              'index.json', 'knowledge-graph/planned-nodes.yaml', 'mkdocs.yml',
              'references/Hoskins2026.md', 'references/Njardvik2025.md',
          }
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f'Unerwartete Payload-Dateien: {sorted(names ^ expected)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'Unsicherer Archiveintrag: {member.name}')
              archive.extractall('.', filter='data')
          PY

      - name: Update changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 0.18.0 – 2026-07-29'
          if heading not in text:
              entry = '''## 0.18.0 – 2026-07-29

          - Einheit 16 „Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen“ ergänzt
          - Angstsymptome, diagnostizierte Angststörungen und ADHS-bezogene Regulationsprobleme methodisch getrennt
          - bidirektionale Verstärkung, Differentialdiagnostik, Sicherheitsverhalten und Vermeidung ohne pauschale Kausalbehauptung eingeordnet
          - zwei aktuelle systematische Reviews, Glossarbegriffe, Anki-Karte, Navigation, Roadmap und Wissensgraph-Planung ergänzt

          '''
              entry = '\n'.join(line.removeprefix('          ') for line in entry.splitlines()) + '\n'
              text = text.replace('# Änderungsverlauf\n\n', '# Änderungsverlauf\n\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install pinned dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies
          npx playwright install --with-deps chromium

      - name: Generate and validate
        env:
          RUNTIME_STATUS_MANAGED: '0'
        run: |
          set -Eeuo pipefail
          git diff --check
          python -m compileall -q scripts tests
          python scripts/validate_prompt_baselines.py
          find Sync -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash Sync/tests/test-posix-sync.sh
          python -m pytest -q
          npm test
          python scripts/build_literature.py
          python scripts/build_graph.py
          python scripts/validate_graph.py
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py
          python scripts/build_anki.py
          python scripts/build_docs.py
          mkdocs build --strict
          node scripts/remark_lint.mjs --files \
            02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md \
            02-Vertiefung/04-Angststoerungen-und-ADHS.md \
            README.md ROADMAP.md Glossar.md CHANGELOG.md \
            references/Hoskins2026.md references/Njardvik2025.md
          npm run test:web

      - name: Commit validated content and remove transient files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/apply-unit16.yml \
            .github/workflows/diagnose-unit16.yml \
            .automation-repair/unit16.payload.*
          git add \
            02-Vertiefung/03-Parkinson-ADHS-mechanistische-Vergleiche-und-Grenzen.md \
            02-Vertiefung/04-Angststoerungen-und-ADHS.md \
            README.md ROADMAP.md Glossar.md CHANGELOG.md cards/cards.yaml index.json \
            knowledge-graph/planned-nodes.yaml mkdocs.yml \
            references/Hoskins2026.md references/Njardvik2025.md \
            Literatur.md references.bib references.json
          git diff --cached --check
          git status --short
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo 'No validated content changes to commit; push is skipped.'
            exit 0
          fi
          git commit -m 'feat: ergänze Einheit 16 zu Angststörungen und ADHS'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/einheit-16-angststoerungen-adhs
