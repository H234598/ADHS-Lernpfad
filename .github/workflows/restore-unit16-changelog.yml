name: Restore unit 16 changelog

on:
  push:
    branches: [agent/einheit-16-angststoerungen-adhs]
    paths:
      - .github/workflows/restore-unit16-changelog.yml

permissions:
  contents: write

concurrency:
  group: restore-unit16-changelog
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-16-angststoerungen-adhs
          fetch-depth: 0
          persist-credentials: false

      - name: Restore validated changelog and keep evidence clarification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout a818b1b3c00408ebdab1e913d149a2baaaf274a2 -- CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- zwei aktuelle Meta-Analysen, Glossarbegriffe, Anki-Karte, Navigation, Roadmap und Wissensgraph-Planung ergänzt'
          new = '- zwei aktuelle Meta-Analysen mit klarer Trennung von Symptomwerten, Diagnosen und Gruppenbefunden sowie Glossarbegriffe, Anki-Karte, Navigation, Roadmap und Wissensgraph-Planung ergänzt'
          if old not in text:
              raise SystemExit('Erwarteter Changelog-Eintrag fehlt')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/restore-unit16-changelog.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: stelle vollständigen Änderungsverlauf wieder her'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/einheit-16-angststoerungen-adhs
