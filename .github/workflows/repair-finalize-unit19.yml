name: Repair unit 19 finalizer

on:
  push:
    branches:
      - agent/einheit-19-bipolare-psychosen-episoden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-finalize-unit-19
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout unit branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-19-bipolare-psychosen-episoden
          fetch-depth: 0

      - name: Insert graph build before documentation build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-unit19.yml')
          text = path.read_text(encoding='utf-8')
          old = (
              '          python scripts/build_anki.py\n'
              '          python scripts/build_docs.py\n'
          )
          new = (
              '          python scripts/build_anki.py\n'
              '          python scripts/build_graph.py\n'
              '          python scripts/build_docs.py\n'
          )
          if text.count(old) != 1:
              raise SystemExit('Erwartete Finalizer-Sequenz fehlt oder ist nicht eindeutig')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/repair-finalize-unit19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-unit19.yml .github/workflows/repair-finalize-unit19.yml
          git commit -m 'fix: erzeuge Wissensgraph vor Dokumentationsbuild'
          git push origin HEAD:agent/einheit-19-bipolare-psychosen-episoden
