name: Temporary unit 17 finalization

on:
  push:
    branches: [agent/einheit-17-zwangssymptome-adhs]

permissions:
  contents: write

concurrency:
  group: temporary-unit17-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out unit branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-17-zwangssymptome-adhs
          fetch-depth: 0

      - name: Apply deterministic documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Erwartete genau einen Treffer in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "02-Vertiefung/04-Angststoerungen-und-ADHS.md",
              "- Weiter: [[ROADMAP#A2 · Angst, Zwang, Trauma und episodische Störungen — P0|Zwang, Trauma und episodische Veränderungen laut Roadmap]]",
              "- Weiter: [[02-Vertiefung/05-Zwangssymptome-und-Zwangsstoerung|Zwangssymptome, Zwangsstörung und ADHS]]",
          )
          replace_once("ROADMAP.md", "last_reviewed: 2026-07-30", "last_reviewed: 2026-07-31")
          replace_once(
              "ROADMAP.md",
              "Der Lernpfad umfasst derzeit 16 fortlaufende Einheiten:",
              "Der Lernpfad umfasst derzeit 17 fortlaufende Einheiten:",
          )
          replace_once(
              "ROADMAP.md",
              "16. Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen",
              "16. Angststörungen und ADHS: Komorbidität, Abgrenzung und Wechselwirkungen\n17. Zwangssymptome, Zwangsstörung und ADHS: Funktion, Abgrenzung und Koexistenz",
          )
          replace_once(
              "ROADMAP.md",
              "- [ ] **Zwangssymptome und Zwangsstörung**",
              "- [x] **Zwangssymptome und Zwangsstörung** — umgesetzt als Einheit 17",
          )
          replace_once(
              "ROADMAP.md",
              "1. **Als Nächstes wird A1 bearbeitet.** Danach folgt grundsätzlich der erste noch offene P0-Block, dessen Voraussetzungen durch vorhandene Einheiten erfüllt sind.",
              "1. Grundsätzlich folgt der erste noch offene P0-Block, dessen Voraussetzungen durch vorhandene Einheiten erfüllt sind.",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "# Änderungsverlauf\n"
          if not text.startswith(heading):
              raise SystemExit("Unerwarteter CHANGELOG-Kopf")
          section = """

          ## 0.19.0 – 2026-07-31

          - Einheit 17 „Zwangssymptome, Zwangsstörung und ADHS: Funktion, Abgrenzung und Koexistenz“ ergänzt
          - Zwangsgedanken, Zwangshandlungen, Perfektionismus, ADHS-bezogene Kompensation und wiederholte Kontrollen nach ihrer Funktion differenziert
          - uneinheitliche Koexistenzschätzungen ohne Scheingenauigkeit eingeordnet und aktuelle S3-Leitlinien- sowie Umbrella-Review-Evidenz ergänzt
          - drei Studienkarten, Glossarbegriffe, Anki-Karte, Navigation, Roadmap und geplante Wissensgraph-Knoten aktualisiert
          """.rstrip() + "\n"
          if "## 0.19.0 – 2026-07-31" not in text:
              changelog.write_text(heading + section + text[len(heading):], encoding="utf-8")
          PY

      - name: Validate changed source files
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/build_literature.py
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          json.loads(Path("index.json").read_text(encoding="utf-8"))
          json.loads(Path("references.json").read_text(encoding="utf-8"))
          yaml.safe_load(Path("cards/cards.yaml").read_text(encoding="utf-8"))
          yaml.safe_load(Path("knowledge-graph/planned-nodes.yaml").read_text(encoding="utf-8"))
          chapter = Path("02-Vertiefung/05-Zwangssymptome-und-Zwangsstoerung.md").read_text(encoding="utf-8")
          for required in ("## Lernziel", "## Review-Frage", "## Wissenschaftliche Quellen", "## Merksatz", "```mermaid"):
              if required not in chapter:
                  raise SystemExit(f"Pflichtabschnitt fehlt: {required}")
          PY

      - name: Commit results and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-unit17-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md ROADMAP.md \
            02-Vertiefung/04-Angststoerungen-und-ADHS.md \
            Literatur.md references.bib references.json
          git commit -m 'docs: finalize unit 17 navigation and roadmap'
          git push origin HEAD:agent/einheit-17-zwangssymptome-adhs
