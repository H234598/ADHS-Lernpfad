name: Repair unit 15 recovery

on:
  push:
    branches: [agent/einheit-15-parkinson-adhs-grenzen-vergleiche]
    paths:
      - '.automation-repair/**'
      - '.github/workflows/repair-unit15.yml'

permissions:
  contents: write

concurrency:
  group: repair-unit15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install recovery bootstrap dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Configure recovery commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Normalize generated citation text
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.automation-repair/repair_unit15.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Bloem, B. R., Okun, M. S., Klein, C. (2021).': 'Bloem, B. R., Okun, M. S., & Klein, C. (2021).',
              'Becker, S., Chowdhury, M., Tavilsup, P., Seitz, D., Callahan, B. L. (2023).': 'Becker, S., Chowdhury, M., Tavilsup, P., Seitz, D., & Callahan, B. L. (2023).',
              'Dobrosavljevic, M., Solares, C., Cortese, S., Andershed, H., Larsson, H. (2020).': 'Dobrosavljevic, M., Solares, C., Cortese, S., Andershed, H., & Larsson, H. (2020).',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Citation pattern missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Repair, validate, and commit existing unit
        shell: bash
        run: |
          rm -f automation-repair-unit15.log
          set +e
          python3 .automation-repair/repair_unit15.py 2>&1 | tee /tmp/automation-repair-unit15.log
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            cp /tmp/automation-repair-unit15.log automation-repair-unit15.log
            git add automation-repair-unit15.log
            git commit -m 'chore: persist unit 15 repair failure diagnostics' || true
            git push origin HEAD:agent/einheit-15-parkinson-adhs-grenzen-vergleiche || true
          fi
          exit $rc
