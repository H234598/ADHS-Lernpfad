name: Repair unit 15 recovery

on:
  push:
    branches: [agent/einheit-15-parkinson-adhs-grenzen-vergleiche]
    paths:
      - '.automation-repair/**'
      - '.github/workflows/repair-unit15.yml'

permissions:
  contents: write

concurrency:
  group: repair-unit15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Repair, validate, and commit existing unit
        run: python3 .automation-repair/repair_unit15.py
