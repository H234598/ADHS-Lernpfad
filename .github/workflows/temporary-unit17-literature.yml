name: Temporary unit 17 literature regeneration

on:
  push:
    branches: [agent/einheit-17-zwangssymptome-adhs]

permissions:
  contents: write

concurrency:
  group: temporary-unit17-literature
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out unit branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-17-zwangssymptome-adhs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Regenerate literature outputs and remove temporary workflow
        run: |
          set -euo pipefail
          python scripts/build_literature.py
          git rm .github/workflows/temporary-unit17-literature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Literatur.md references.bib references.json
          git commit -m 'docs: regenerate literature outputs for unit 17'
          git push origin HEAD:agent/einheit-17-zwangssymptome-adhs
