name: Temporary B607 repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/qlty-b607-automation-status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/qlty-b607-automation-status
          persist-credentials: true

      - name: Apply exact B607 repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/automation_status.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import re\nimport subprocess\n'
          new_import = 'import re\nimport shutil\nimport subprocess\n'
          if text.count(old_import) != 1:
              raise SystemExit('expected import anchor not found exactly once')
          text = text.replace(old_import, new_import, 1)

          old_block = '''    if not candidate:\n        try:\n            candidate = subprocess.run(\n                ["git", "rev-parse", "HEAD"],\n                cwd=ROOT,\n                check=True,\n                capture_output=True,\n                text=True,\n            ).stdout.strip()\n        except (OSError, subprocess.CalledProcessError):\n            return None\n'''
          new_block = '''    if not candidate:\n        git_executable = shutil.which("git")\n        if not git_executable:\n            return None\n        try:\n            candidate = subprocess.run(\n                [str(Path(git_executable).resolve()), "rev-parse", "HEAD"],\n                cwd=ROOT,\n                check=True,\n                capture_output=True,\n                text=True,\n            ).stdout.strip()\n        except (OSError, subprocess.CalledProcessError):\n            return None\n'''
          if text.count(old_block) != 1:
              raise SystemExit('expected _git_sha block not found exactly once')
          path.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')
          PY

          git rm .github/workflows/temporary-b607-repair.yml
          git diff --check
          git diff -- scripts/automation_status.py
          git config user.name 'H234598'
          git config user.email '54270221+H234598@users.noreply.github.com'
          git add scripts/automation_status.py
          git commit -m 'fix: resolve Git executable before status fallback'
          git push origin HEAD:fix/qlty-b607-automation-status
