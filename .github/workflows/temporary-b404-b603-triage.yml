name: Temporary B404/B603 triage

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/qlty-b607-automation-status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/qlty-b607-automation-status
          persist-credentials: true

      - name: Apply exact scanner triage and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/automation_status.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import subprocess\n'
          new_import = 'import subprocess  # nosec B404 -- fixed non-shell git fallback with resolved executable\n'
          if text.count(old_import) != 1:
              raise SystemExit('expected subprocess import anchor not found exactly once')
          text = text.replace(old_import, new_import, 1)

          old_call = '            candidate = subprocess.run(\n'
          new_call = '            candidate = subprocess.run(  # nosec B603 -- executable resolved absolutely; argv constant; shell never used\n'
          if text.count(old_call) != 1:
              raise SystemExit('expected subprocess.run anchor not found exactly once')
          path.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')
          PY

          git rm .github/workflows/temporary-b404-b603-triage.yml
          git diff --check
          git diff -- scripts/automation_status.py
          git config user.name 'H234598'
          git config user.email '54270221+H234598@users.noreply.github.com'
          git add scripts/automation_status.py
          git commit -m 'chore: triage controlled automation subprocess boundary'
          git push origin HEAD:fix/qlty-b607-automation-status
