name: Temporary B603 comment wrap

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/qlty-b607-automation-status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/qlty-b607-automation-status
          persist-credentials: true

      - name: Wrap exact scanner comment and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/automation_status.py')
          text = path.read_text(encoding='utf-8')
          old = '            candidate = subprocess.run(  # nosec B603 -- executable resolved absolutely; argv constant; shell never used\n'
          new = '            # Fixed argv, absolute executable, and no shell boundary.\n            candidate = subprocess.run(  # nosec B603\n'
          if text.count(old) != 1:
              raise SystemExit('expected B603 comment anchor not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/temporary-b603-comment-wrap.yml
          git diff --check
          git config user.name 'H234598'
          git config user.email '54270221+H234598@users.noreply.github.com'
          git add scripts/automation_status.py
          git commit -m 'chore: wrap controlled subprocess annotation'
          git push origin HEAD:fix/qlty-b607-automation-status
