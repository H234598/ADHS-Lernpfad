name: Diagnose PR 44 validation cancellation

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 44
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and print tail of cancelled validation job
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '90125492492'
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" -o /tmp/job-logs.bin
          file /tmp/job-logs.bin
          if unzip -t /tmp/job-logs.bin >/dev/null 2>&1; then
            unzip -p /tmp/job-logs.bin > /tmp/job-logs.txt
          else
            cp /tmp/job-logs.bin /tmp/job-logs.txt
          fi
          echo '--- last 200 lines of cancelled job ---'
          tail -n 200 /tmp/job-logs.txt
