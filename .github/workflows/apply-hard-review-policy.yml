name: Apply hard review policy

on:
  push:
    branches: [feat/hard-review-repair-policy]
    paths:
      - '.policy-bootstrap/**'
      - '.github/workflows/apply-hard-review-policy.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.policy-bootstrap/**'
      - '.github/workflows/apply-hard-review-policy.yml'

permissions:
  contents: write

concurrency:
  group: apply-hard-review-policy
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feat/hard-review-repair-policy' || github.ref_name == 'feat/hard-review-repair-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v7
        with:
          ref: feat/hard-review-repair-policy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Finalize, validate, commit, and push policy
        id: finalizer
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .policy-bootstrap/apply.py 2>&1 | tee "$RUNNER_TEMP/policy-finalizer.log"

      - name: Upload policy finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-finalizer-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/policy-finalizer.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce finalizer result
        if: always()
        run: test '${{ steps.finalizer.outcome }}' = 'success'
