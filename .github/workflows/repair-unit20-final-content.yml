name: Repair unit 20 final content

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-unit20-final-content
  cancel-in-progress: false

jobs:
  repair:
    name: Apply, regenerate, validate and commit final content
    if: github.event.pull_request.number == 50
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout fixed unit branch without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-20-substanzgebrauch-abhaengigkeit
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies
          npx playwright install --with-deps chromium

      - name: Apply verified CodeRabbit fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one occurrence, found {count}: {old[:120]!r}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          unit = "02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md"
          replace_once(
              unit,
              "> [!evidence] Evidenz: Leitlinien- und Konsenskonsens / hoch",
              "> [!evidence] Evidenz: Leitlinien- und Expert:innenkonsens / hoch",
          )
          replace_once(
              unit,
              "> Bewusstlosigkeit, nicht normale Atmung, Krampfanfälle, starke Brustschmerzen, schwere Verwirrtheit, ausgeprägte Überhitzung, akute psychotische oder manische Symptome, ein unmittelbar gefährlicher Entzug oder eine konkrete Suizidgefahr erfordern **112** beziehungsweise den örtlichen Notruf. Eine betroffene Person sollte bei akuter Gefahr nicht allein gelassen werden.\n\nBei nicht akutem, aber riskantem Konsum ist eine zeitnahe ärztliche, psychiatrische oder suchtmedizinische Abklärung sinnvoll.",
              "> Bewusstlosigkeit, nicht normale Atmung, Krampfanfälle, starke Brustschmerzen, ausgeprägte Überhitzung, unmittelbare Lebensgefahr, schwere körperliche Beeinträchtigung, schwere Verwirrtheit mit nicht gewährleisteter Sicherheit, ein unmittelbar gefährlicher Entzug oder eine konkrete Suizidgefahr erfordern **112** beziehungsweise den örtlichen Notruf. Eine betroffene Person sollte bei akuter Gefahr nicht allein gelassen werden.\n\nNeue psychotische oder manische Symptome ohne unmittelbare Gefährdung erfordern eine dringende psychiatrische beziehungsweise suchtmedizinische Abklärung. Bei nicht akutem, aber riskantem Konsum ist eine zeitnahe ärztliche, psychiatrische oder suchtmedizinische Abklärung sinnvoll.",
          )

          replace_once(
              "Glossar.md",
              "## Abhängigkeit\nKlinisch relevantes Muster mit eingeschränkter Kontrolle, zunehmender Priorität der Substanz und fortgesetzter Nutzung trotz schädlicher Folgen; kein moralisches Urteil und nicht mit jedem Substanzgebrauch gleichzusetzen.",
              "## Abhängigkeit\nIm ICD-11 bezeichnet das Abhängigkeitssyndrom eine Störung der Regulation des Substanzgebrauchs mit eingeschränkter Kontrolle, zunehmender Priorität der Substanz und fortgesetzter Nutzung trotz schädlicher Folgen. Toleranz und Entzug können auftreten, sind für das Syndrom aber nicht zwingend erforderlich; der Begriff ist kein moralisches Urteil.",
          )
          replace_once(
              "Glossar.md",
              "## Substanzgebrauchsstörung\nAnhaltendes Substanzgebrauchsmuster mit relevantem Kontrollverlust, Priorisierung, Risiken oder Beeinträchtigungen; gelegentlicher Gebrauch oder ein einzelnes Symptom reicht nicht für die Diagnose.",
              "## Substanzgebrauchsstörung\nKlassifikationsabhängiger Oberbegriff: Im DSM-5/DSM-5-TR bezeichnet er eine nach Schweregrad abgestufte Diagnose anhand eines breiten Kriterienkatalogs. Das ICD-11 kodiert unter anderem schädliche Gebrauchsmuster und das Abhängigkeitssyndrom getrennt. Gelegentlicher Gebrauch oder ein einzelnes Symptom reicht in keinem System für eine Diagnose.",
          )

          authors = [
              "Young, Susan",
              "Abbasian, Cyrus",
              "Al-Attar, Zainab",
              "Branney, Polly",
              "Colley, Bill",
              "Cortese, Samuele",
              "Cubbin, Sally",
              "Deeley, Quinton",
              "Gudjonsson, Gisli Hannes",
              "Hill, Peter",
              "Hollingdale, Jack",
              "Jenden, Steve",
              "Johnson, Joe",
              "Judge, Deborah",
              "Lewis, Alexandra",
              "Mason, Peter",
              "Mukherjee, Raja",
              "Nutt, David",
              "Roberts, Jane",
              "Robinson, Fiona",
              "Woodhouse, Emma",
              "Cocallis, Kelly",
          ]
          ref = Path("references/Young2023.md")
          text = ref.read_text(encoding="utf-8")
          authors_new = (
              "  authors:\n"
              + "\n".join(f'    - "{author}"' for author in authors)
              + "\n  et_al: false"
          )
          text, count = re.subn(
              r'(?ms)^  authors:\n(?:    - "[^"]+"\n)+  et_al: true$',
              authors_new,
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f"references/Young2023.md: author block matches={count}")

          old_citation = (
              "Young, Susan, Abbasian, Cyrus, Al-Attar, Zainab, et al. (2023). "
              "Identification and treatment of individuals with attention-deficit/hyperactivity "
              "disorder and substance use disorder: An expert consensus statement."
          )
          new_citation = (
              "Young, Susan, Abbasian, Cyrus, Al-Attar, Zainab, Branney, Polly, "
              "Colley, Bill, Cortese, Samuele, Cubbin, Sally, Deeley, Quinton, "
              "Gudjonsson, Gisli Hannes, Hill, Peter, Hollingdale, Jack, Jenden, Steve, "
              "Johnson, Joe, Judge, Deborah, Lewis, Alexandra, Mason, Peter, Mukherjee, Raja, "
              "Nutt, David, Roberts, Jane, Robinson, Fiona, Woodhouse, Emma, & Cocallis, Kelly "
              "(2023). Identification and treatment of individuals with attention-deficit/"
              "hyperactivity disorder and substance use disorder: An expert consensus statement."
          )
          if text.count(old_citation) != 1:
              raise RuntimeError("references/Young2023.md: abbreviated citation not found exactly once")
          text = text.replace(old_citation, new_citation, 1)
          ref.write_text(text, encoding="utf-8")

          frontmatter_match = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
          if not frontmatter_match:
              raise RuntimeError("references/Young2023.md: missing frontmatter")
          metadata = yaml.safe_load(frontmatter_match.group(1))
          parsed_authors = metadata["citation"]["authors"]
          if parsed_authors != authors or metadata["citation"]["et_al"] is not False:
              raise RuntimeError("references/Young2023.md: parsed author metadata is incomplete")
          print(f"Validated {len(parsed_authors)} Young2023 authors")
          PY

      - name: Regenerate literature deterministically
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_literature.py
          cp Literatur.md /tmp/Literatur.md.first
          cp references.bib /tmp/references.bib.first
          cp references.json /tmp/references.json.first
          python scripts/build_literature.py
          cmp Literatur.md /tmp/Literatur.md.first
          cmp references.bib /tmp/references.bib.first
          cmp references.json /tmp/references.json.first

      - name: Run complete validation pipeline
        shell: bash
        env:
          RUNTIME_STATUS_MANAGED: '1'
        run: |
          set -Eeuo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          HEAD_SHA="$(git rev-parse HEAD)"
          mkdir -p build
          python scripts/runtime_status_cli.py build/runtime-status.json \
            --new-run --workflow validate-graph-and-build \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --git-sha "$HEAD_SHA"

          git diff --check
          python -m compileall -q scripts tests
          python scripts/validate_prompt_baselines.py
          find Sync -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          pwsh -NoProfile -Command '
            $failed = $false
            Get-ChildItem Sync -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $failed = $true
                Write-Host "PowerShell-Parserfehler in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              }
            }
            if ($failed) { exit 1 }
          '
          bash Sync/tests/test-posix-sync.sh 2>&1 | tee build/sync-test.log

          RUNTIME_STATUS_MANAGED=0 python -m pytest -q
          npm test
          npm run lint:markdown:all
          cmp Literatur.md /tmp/Literatur.md.first
          cmp references.bib /tmp/references.bib.first
          cmp references.json /tmp/references.json.first
          GITHUB_SHA="$HEAD_SHA" python scripts/build_graph.py --status-file build/runtime-status.json
          python scripts/validate_graph.py --expected-revision "$HEAD_SHA"
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py --status-file build/runtime-status.json
          python scripts/build_anki.py
          cp build/runtime-status.json build/runtime-status-pre-final.json
          python scripts/runtime_status_cli.py build/runtime-status.json \
            --finish success --phase complete
          python scripts/validate_runtime_status.py build/runtime-status.json
          python scripts/build_docs.py
          mkdocs build --strict
          npm run test:web

      - name: Commit and push validated content only
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          allowed_paths=(
            "02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md"
            "Glossar.md"
            "Literatur.md"
            "references.bib"
            "references.json"
            "references/Young2023.md"
          )
          git add -A -- "${allowed_paths[@]}"
          git diff --cached --check

          declare -A allowed=()
          for path in "${allowed_paths[@]}"; do
            allowed["$path"]=1
          done
          while IFS= read -r path; do
            if [[ -z "${allowed[$path]+x}" ]]; then
              echo "Unerwartete gestagte Datei: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only)

          git config user.name "H234598"
          git config user.email "54270221+H234598@users.noreply.github.com"
          git commit -m "fix: arbeite finale CodeRabbit-Befunde zu Einheit 20 auf"

          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          header="AUTHORIZATION: basic $auth"
          echo "::add-mask::$auth"
          echo "::add-mask::$header"
          GIT_AUTH_HEADER="$header" \
            git --config-env=http.https://github.com/.extraheader=GIT_AUTH_HEADER \
            push origin HEAD:agent/einheit-20-substanzgebrauch-abhaengigkeit

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit20-final-content-repair-${{ github.run_attempt }}
          path: |
            build/runtime-status.json
            build/runtime-status-validation-report.json
            build/runtime-status-validation-report.md
            build/validation-report.txt
            build/sync-test.log
            build/playwright-results/
          if-no-files-found: warn
          retention-days: 14
