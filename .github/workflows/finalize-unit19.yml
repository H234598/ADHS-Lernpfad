name: Finalize unit 19
# Retry after deterministic EOF normalization.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-unit-19
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout unit branch
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-19-bipolare-psychosen-episoden
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies

      - name: Integrate unit and regenerate derived outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_unit19.py
          python - <<'PY'
          from pathlib import Path
          path = Path('Glossar.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python scripts/build_literature.py
          git add Literatur.md references.bib references.json
          python scripts/build_literature.py
          git diff --exit-code -- Literatur.md references.bib references.json

      - name: Validate complete project state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/validate_prompt_baselines.py
          python scripts/build_graph.py
          python scripts/validate_graph.py --expected-revision "$(git rev-parse HEAD)"
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py
          python scripts/build_anki.py
          python scripts/build_docs.py
          mkdocs build --strict
          REMARK_BASE_SHA=origin/main REMARK_HEAD_SHA=HEAD \
            npm run lint:markdown:changed

      - name: Commit final content and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-unit19.yml
          rm scripts/finalize_unit19.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integriere Einheit 19 vollständig'
          git push origin HEAD:agent/einheit-19-bipolare-psychosen-episoden
