          cards = cards_path.read_text(encoding="utf-8").rstrip() + "\n"
          if "  unit: 20\n" in cards or "- id: 1020\n" in cards:
              raise RuntimeError("cards/cards.yaml: Einheit 20 oder Karten-ID 1020 existiert bereits")
          cards_path.write_text(cards + CARD_ADD, encoding="utf-8")

          glossary_path = Path("Glossar.md")
          glossary = glossary_path.read_text(encoding="utf-8")
          if glossary.count("last_reviewed: 2026-08-04") != 1:
              raise RuntimeError("Glossar.md: unerwartetes last_reviewed")
          glossary = glossary.replace("last_reviewed: 2026-08-04", "last_reviewed: 2026-08-06", 1)
          old_hypomania = "psychotische Symptome sprechen gegen eine bloße Hypomanie."
          new_hypomania = "psychotische Symptome schließen eine Hypomanie als Episodenklassifikation aus."
          if glossary.count(old_hypomania) == 1:
              glossary = glossary.replace(old_hypomania, new_hypomania, 1)
          elif glossary.count(new_hypomania) != 1:
              raise RuntimeError("Glossar.md: Hypomanie-Definition ist unerwartet")
          for heading in ["## Abhängigkeit", "## Diversion", "## Entzug", "## Intoxikation", "## Mischkonsum", "## Nichtmedizinische Stimulanziennutzung", "## Substanzgebrauchsstörung"]:
              if heading in glossary:
                  raise RuntimeError(f"Glossar.md: {heading} existiert bereits")
          glossary_path.write_text(glossary.rstrip() + "\n" + GLOSSARY_ADD, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if "## 0.22.0 – 2026-08-06" in changelog:
              raise RuntimeError("CHANGELOG.md: Version 0.22.0 existiert bereits")
          header = "# Änderungsverlauf\n\n"
          if not changelog.startswith(header):
              raise RuntimeError("CHANGELOG.md: unerwarteter Kopf")
          changelog_path.write_text(header + CHANGELOG_SECTION + changelog[len(header):], encoding="utf-8")

          print("Inhalte für Einheit 20 angewendet")
          PY

      - name: Install pinned dependencies and browser
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check             -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies
          npx playwright install --with-deps chromium

      - name: Generate literature and run complete validation
        shell: bash
        env:
          RUNTIME_STATUS_MANAGED: '1'
        run: |
          set -Eeuo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p build
          python scripts/runtime_status_cli.py build/runtime-status.json             --new-run --workflow finalize-unit20             --run-id "${{ github.run_id }}-${{ github.run_attempt }}"             --git-sha "$GITHUB_SHA"

          git diff --check
          python -m compileall -q scripts tests
          python scripts/validate_prompt_baselines.py
          find Sync -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          pwsh -NoProfile -Command '
            $failed = $false
            Get-ChildItem Sync -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $failed = $true
                Write-Host "PowerShell-Parserfehler in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              }
            }
            if ($failed) { exit 1 }
          '
          bash Sync/tests/test-posix-sync.sh 2>&1 | tee build/sync-test.log

          RUNTIME_STATUS_MANAGED=0 python -m pytest -q
          npm test
          npm run lint:markdown:all

          python scripts/build_literature.py
          cp Literatur.md /tmp/Literatur.md.first
          cp references.bib /tmp/references.bib.first
          cp references.json /tmp/references.json.first
          python scripts/build_literature.py
          cmp Literatur.md /tmp/Literatur.md.first
          cmp references.bib /tmp/references.bib.first
          cmp references.json /tmp/references.json.first

          python scripts/build_graph.py --status-file build/runtime-status.json
          python scripts/validate_graph.py --expected-revision "$GITHUB_SHA"
          python scripts/validate_links.py
          python scripts/validate_compendium.py
          python scripts/build_combined.py --status-file build/runtime-status.json
          python scripts/build_anki.py
          cp build/runtime-status.json build/runtime-status-pre-final.json
          python scripts/runtime_status_cli.py build/runtime-status.json             --finish success --phase complete
          python scripts/validate_runtime_status.py build/runtime-status.json
          python scripts/build_docs.py
          mkdocs build --strict
          npm run test:web

      - name: Commit validated unit, remove one-time workflow and push
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm .github/workflows/finalize-unit20.yml

          allowed_paths=(
            ".github/workflows/finalize-unit20.yml"
            "02-Vertiefung/07-Bipolare-Stoerungen-Psychosen-und-episodische-Veraenderungen.md"
            "02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md"
            "CHANGELOG.md"
            "Glossar.md"
            "Literatur.md"
            "README.md"
            "ROADMAP.md"
            "cards/cards.yaml"
            "index.json"
            "mkdocs.yml"
            "references.bib"
            "references.json"
            "references/Comiskey2026.md"
            "references/Forrest2025.md"
            "references/Shanbhag2026.md"
            "references/Young2023.md"
          )

          git add -A -- "${allowed_paths[@]}"
          git diff --cached --check

          declare -A allowed=()
          for path in "${allowed_paths[@]}"; do
            allowed["$path"]=1
          done
          while IFS= read -r path; do
            if [[ -z "${allowed[$path]+x}" ]]; then
              echo "Unerwartete gestagte Datei: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only)

          test -f 02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md
          test ! -e .github/workflows/finalize-unit20.yml
          git diff --cached --name-only | grep -Fx             "02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md"

          git config user.name "H234598"
          git config user.email "54270221+H234598@users.noreply.github.com"
          git commit -m "feat: ergänze Einheit 20 zu Substanzgebrauch und ADHS"

          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth"             push origin HEAD:agent/einheit-20-substanzgebrauch-abhaengigkeit

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finalize-unit20-diagnostics-${{ github.run_attempt }}
          path: |
            build/runtime-status.json
            build/runtime-status-validation-report.json
            build/runtime-status-validation-report.md
            build/validation-report.txt
            build/sync-test.log
            build/playwright-results/
          if-no-files-found: warn
          retention-days: 14
