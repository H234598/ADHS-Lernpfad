name: Finalize unit 20 runner

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-unit20-runner
  cancel-in-progress: false

jobs:
  finalize:
    name: Generate, validate and commit unit 20 content
    if: github.event.pull_request.head.ref == 'agent/einheit-20-substanzgebrauch-abhaengigkeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout fixed unit branch without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: agent/einheit-20-substanzgebrauch-abhaengigkeit
          fetch-depth: 0
          persist-credentials: false

      - name: Detect already finalized content
        id: guard
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f 02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Einheit 20 ist bereits materialisiert; kein zweiter Inhaltscommit.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-export.txt

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Extract verified generator and validation scripts
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          SOURCE_COMMIT: 2d3999b0838caa55cf3db0b0224c68ec1923b7da
        run: |
          set -Eeuo pipefail
          git show "$SOURCE_COMMIT:.github/workflows/finalize-unit20.yml" > "$RUNNER_TEMP/finalize-unit20-source.yml"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source = Path(os.environ['RUNNER_TEMP'], 'finalize-unit20-source.yml').read_text(encoding='utf-8')

          def extract_step(name: str) -> str:
              lines = source.splitlines()
              marker = f'      - name: {name}'
              try:
                  marker_index = lines.index(marker)
              except ValueError as exc:
                  raise RuntimeError(f'Schritt nicht gefunden: {name}') from exc
              run_index = None
              for index in range(marker_index + 1, len(lines)):
                  if lines[index].startswith('      - name: '):
                      break
                  if lines[index] == '        run: |':
                      run_index = index
                      break
              if run_index is None:
                  raise RuntimeError(f'run-Block nicht gefunden: {name}')
              body = []
              for line in lines[run_index + 1:]:
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip() == '':
                      body.append('')
                  else:
                      raise RuntimeError(f'Unerwartete Einrückung in {name}: {line!r}')
              return '\n'.join(body).rstrip() + '\n'

          apply_script = extract_step('Apply researched unit and project integration')
          validate_script = extract_step('Generate literature and run complete validation')
          validate_script = validate_script.replace('--workflow finalize-unit20', '--workflow manual')
          validate_script = re.sub(r'\$\{\{\s*github\.run_id\s*\}\}', '$GITHUB_RUN_ID', validate_script)
          validate_script = re.sub(r'\$\{\{\s*github\.run_attempt\s*\}\}', '$GITHUB_RUN_ATTEMPT', validate_script)

          Path(os.environ['RUNNER_TEMP'], 'apply-unit20.sh').write_text(apply_script, encoding='utf-8')
          Path(os.environ['RUNNER_TEMP'], 'validate-unit20.sh').write_text(validate_script, encoding='utf-8')
          PY
          bash -n "$RUNNER_TEMP/apply-unit20.sh"
          bash -n "$RUNNER_TEMP/validate-unit20.sh"

      - name: Apply researched unit and project integration
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: bash "$RUNNER_TEMP/apply-unit20.sh"

      - name: Install pinned dependencies and browser
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt -r requirements-export.txt
          python -m pip check
          npm ci
          npm run audit:dependencies
          npx playwright install --with-deps chromium

      - name: Run complete reproducible validation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          RUNTIME_STATUS_MANAGED: '1'
        run: bash "$RUNNER_TEMP/validate-unit20.sh"

      - name: Commit and push validated content only
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          allowed_paths=(
            "02-Vertiefung/07-Bipolare-Stoerungen-Psychosen-und-episodische-Veraenderungen.md"
            "02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md"
            "CHANGELOG.md"
            "Glossar.md"
            "Literatur.md"
            "README.md"
            "ROADMAP.md"
            "cards/cards.yaml"
            "index.json"
            "mkdocs.yml"
            "references.bib"
            "references.json"
            "references/Comiskey2026.md"
            "references/Forrest2025.md"
            "references/Shanbhag2026.md"
            "references/Young2023.md"
          )

          git add -A -- "${allowed_paths[@]}"
          git diff --cached --check

          declare -A allowed=()
          for path in "${allowed_paths[@]}"; do
            allowed["$path"]=1
          done
          while IFS= read -r path; do
            if [[ -z "${allowed[$path]+x}" ]]; then
              echo "Unerwartete gestagte Datei: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only)

          test -f 02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md
          git diff --cached --name-only | grep -Fx \
            "02-Vertiefung/08-Substanzgebrauch-Abhaengigkeit-und-ADHS.md"

          git config user.name "H234598"
          git config user.email "54270221+H234598@users.noreply.github.com"
          git commit -m "feat: ergänze Einheit 20 zu Substanzgebrauch und ADHS"

          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:agent/einheit-20-substanzgebrauch-abhaengigkeit

      - name: Upload diagnostics
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: finalize-unit20-runner-diagnostics-${{ github.run_attempt }}
          path: |
            build/runtime-status.json
            build/runtime-status-validation-report.json
            build/runtime-status-validation-report.md
            build/validation-report.txt
            build/sync-test.log
            build/playwright-results/
          if-no-files-found: warn
          retention-days: 14
