# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit ist für automatische Einheiten ein verpflichtendes hartes Gate.
# Ein deterministischer Router entscheidet nur über die Anwendbarkeit; die
# Bedeutung von Lernkarten und die Belegbarkeit geänderter Aussagen werden
# ausdrücklich semantisch geprüft.
reviews:
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches: []
  pre_merge_checks:
    override_requested_reviewers_only: true
    custom_checks:
      - name: "content-scope"
        mode: "error"
        instructions: >-
          Pass if the pull request changes no Markdown below 01-Grundlagen/ or
          02-Vertiefung/ and no scientific support file under references/ or in
          Glossar.md, Literatur.md, references.bib, references.json, or
          cards/cards.yaml. Otherwise compare base and head content plus the
          surrounding learning context. Fail when the revision removes or
          displaces a learning objective, required differential distinction,
          uncertainty, safety boundary, or scope limit; turns association into
          causation; turns group evidence into an individual conclusion;
          overstates guideline, consensus, observational, or trial evidence; or
          adds unsafe diagnostic, dosing, withdrawal, or self-treatment advice.
          Do not infer a pass when context is insufficient: return inconclusive
          and request the missing context so the error-mode check remains
          blocking.
      - name: "claim-source-entailment"
        mode: "error"
        instructions: >-
          Pass if no scientific claim or supporting reference changed. For every
          changed scientific claim, identify its cited structured source card and
          verify that population, design, comparator, exposure, outcome, effect
          measure, uncertainty, publication status, and evidentiary direction
          support exactly the wording and scope used. Fail unsupported claims,
          citation mismatch, omitted material limitations, source-type inflation,
          association-to-causation drift, group-to-individual extrapolation, or
          broader claims than the cited evidence permits. A bibliography entry or
          plausible topic match is not entailment. If the cited source or required
          context cannot be inspected, return inconclusive and request it rather
          than passing.
