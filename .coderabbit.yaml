# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit ist ein verpflichtendes hartes Gate, wird aus Kostengründen aber
# ausschließlich explizit angefordert, nachdem alle Non-CodeRabbit-Gates des
# aktuellen PR-Heads grün sind. Automatische und inkrementelle Reviews bleiben
# deaktiviert; .github/workflows/coderabbit-after-green.yml übernimmt das
# deduplizierte Review-Request pro Head-SHA.
reviews:
  request_changes_workflow: true
  auto_review:
    enabled: false
    drafts: false
    auto_incremental_review: false
    base_branches: []
  pre_merge_checks:
    override_requested_reviewers_only: true
    custom_checks:
      - name: "content-scope"
        mode: "error"
        instructions: >-
          Scope this check strictly to the current pull request diff against its
          current base branch. Ignore historical commits, merge-parent contents,
          and files that are unchanged relative to the current base. First inspect
          the current changed-file list. Pass immediately as not applicable if it
          contains no Markdown below 01-Grundlagen/ or 02-Vertiefung/ and no
          scientific support file under references/ or in Glossar.md, Literatur.md,
          references.bib, references.json, or cards/cards.yaml. Do not inspect or
          fail on scientific content outside that current changed-file set.
          Otherwise compare only the changed learning/scientific files plus the
          minimum surrounding context needed to understand them. Fail when the
          revision removes or displaces a learning objective, required differential
          distinction, uncertainty, safety boundary, or scope limit; turns
          association into causation; turns group evidence into an individual
          conclusion; overstates guideline, consensus, observational, or trial
          evidence; or adds unsafe diagnostic, dosing, withdrawal, or
          self-treatment advice. Do not infer a pass when relevant changed-file
          context is insufficient: return inconclusive and request that context so
          the error-mode check remains blocking.
      - name: "claim-source-entailment"
        mode: "error"
        instructions: >-
          Scope this check strictly to the current pull request diff against its
          current base branch. Ignore historical commits, merge-parent contents,
          and scientific files that are unchanged relative to the current base.
          First inspect the current changed-file list. Pass immediately as not
          applicable if that list contains no changed learning/scientific Markdown,
          structured source card, Glossar.md, Literatur.md, references.bib,
          references.json, or cards/cards.yaml. Do not inspect or fail on claims in
          files outside the current changed-file set merely because they occur in
          branch history. For every scientific claim that actually changed in the
          current diff, identify its cited structured source card and verify that
          population, design, comparator, exposure, outcome, effect measure,
          uncertainty, publication status, and evidentiary direction support
          exactly the wording and scope used. Fail unsupported changed claims,
          citation mismatch, omitted material limitations, source-type inflation,
          association-to-causation drift, group-to-individual extrapolation, or
          broader claims than the cited evidence permits. A bibliography entry or
          plausible topic match is not entailment. If a source required for an
          actually changed claim cannot be inspected, return inconclusive and
          request it rather than passing.
