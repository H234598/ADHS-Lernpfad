# CodeRabbit ist für automatische Einheiten ein verpflichtendes hartes Gate.
# Der Merge-Wächter verlangt ein erfolgreiches Signal des aktuellen Heads und
# vollständig gelöste Review-Threads. Schweigen, Limiterschöpfung oder ein
# ungeklärter Dissens blockieren Ready for review und Merge.
#
# Inkrementelle Reviews bleiben aktiviert, damit jeder Reparaturpush erneut
# gegen den aktuellen Head geprüft wird.
reviews:
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches: []
